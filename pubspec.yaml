name: user_app
description: "Cric Mania - Cricket App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.3.0
  firebase_storage: ^12.3.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  image: ^4.1.0
  http: ^1.1.0
  screenshot: ^3.0.0
  path_provider: ^2.1.4
  image_gallery_saver_plus: ^5.1.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0A1931"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: fonts/NotoNastaliqUrdu-Regular.ttf